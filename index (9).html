<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BLOOM — Generative Sculpture</title>
<style>
  :root{color-scheme:dark;--text:#f2f0fa;--muted:#9d9aa9;--line:rgba(255,255,255,.12);--glass:rgba(24,22,33,.68);--accent:#bdb1ff}
  *{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#05050a;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;color:var(--text)}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}#scene.dragging{cursor:grabbing}
  .grain{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at 49% 50%,transparent 15%,rgba(2,2,7,.46) 84%),linear-gradient(90deg,rgba(17,12,30,.22),transparent 30%,transparent 73%,rgba(6,14,22,.18));z-index:1}
  .grain:after{content:"";position:absolute;inset:0;opacity:.19;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.19'/%3E%3C/svg%3E")}
  .top{position:fixed;z-index:3;top:35px;left:42px;right:42px;display:flex;align-items:start;justify-content:space-between;pointer-events:none}
  .kicker{font-size:10px;letter-spacing:.35em;font-weight:800;color:#c5b9ff}.title{font-weight:650;letter-spacing:-.04em;font-size:clamp(33px,4.6vw,60px);line-height:1.05;margin:16px 0 9px}.desc{color:#aaa5b8;letter-spacing:-.02em;font-size:13px;line-height:1.6}.live{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:25px;padding:11px 15px;background:rgba(22,20,32,.45);backdrop-filter:blur(12px);font-size:10px;letter-spacing:.16em;color:#c6c1d4}.dot{width:6px;height:6px;background:#b8ffcc;border-radius:50%;box-shadow:0 0 11px #85ffbd}
  .panel{position:fixed;z-index:4;right:36px;top:50%;transform:translateY(-44%);width:305px;max-height:calc(100vh - 135px);overflow:auto;padding:23px 23px 21px;background:var(--glass);border:1px solid rgba(255,255,255,.15);border-radius:20px;box-shadow:0 18px 95px rgba(0,0,0,.42);backdrop-filter:blur(24px);scrollbar-width:thin;scrollbar-color:#3f3a52 transparent}
  .panel-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.panel-name{font-weight:700;font-size:12px;letter-spacing:.13em}.micro{font-size:9px;letter-spacing:.12em;color:#847f96}
  .group{padding-top:17px;border-top:1px solid rgba(255,255,255,.08);margin-top:17px}.group .gtitle{display:flex;align-items:center;justify-content:space-between;color:#a7a3b5;font-size:10px;font-weight:700;letter-spacing:.15em;margin-bottom:14px}.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.modes button{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);border-radius:9px;color:#b6b2c3;padding:10px 0;cursor:pointer;font-size:11px;transition:background .2s,border-color .2s,color .2s}.modes button.active{background:rgba(178,160,255,.16);border-color:#8d80ba;color:#ede5ff}.modes button:hover{background:rgba(255,255,255,.12)}
  .swatches{display:flex;gap:11px}.swatch{width:30px;height:30px;border:0;border-radius:50%;cursor:pointer;position:relative;outline:1px solid rgba(255,255,255,.2);outline-offset:2px;transition:transform .18s}.swatch:hover{transform:scale(1.12)}.swatch.active:after{content:"";position:absolute;inset:-6px;border:1px solid #fff;border-radius:50%;opacity:.8}.swatch[data-color=pearl]{background:linear-gradient(135deg,#fff,#c0d3ff,#d9aaff)}.swatch[data-color=aurora]{background:linear-gradient(135deg,#a2ffee,#46bfc4,#8b86ff)}.swatch[data-color=rose]{background:linear-gradient(135deg,#ffe5e9,#ec8cba,#bca2ff)}
  .control{margin:15px 0 0}.c-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:11px;color:#c5c0d1}.value{font-variant-numeric:tabular-nums;color:#857caa}input[type=range]{width:100%;height:3px;appearance:none;-webkit-appearance:none;cursor:pointer;background:linear-gradient(90deg,#a99aff var(--v,50%),rgba(255,255,255,.16) var(--v,50%));border-radius:9px;margin:0 0 4px}input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:13px;height:13px;background:#e1dcff;border:2px solid #9185cb;border-radius:50%;box-shadow:0 0 12px #907ed577}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:19px}.actions button{min-height:39px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.06);border-radius:9px;color:#e4e1ef;font-size:11px;cursor:pointer}.actions button:hover{background:rgba(255,255,255,.16)}.actions button.primary{background:#ded8ff;color:#161022;font-weight:700}.actions button.primary:hover{background:#fff}
  .bottom{position:fixed;z-index:3;bottom:32px;left:42px;display:flex;align-items:center;gap:17px;pointer-events:none}.status{font-size:11px;letter-spacing:.16em;color:#e0d8f7}.status i{display:inline-block;width:7px;height:7px;background:#b6a4ff;border-radius:50%;margin-right:8px;box-shadow:0 0 14px #ab92ff}.hint{font-size:11px;color:#777385}.sep{height:16px;width:1px;background:#4c4559}.credit{position:fixed;bottom:33px;right:40px;font-size:10px;letter-spacing:.16em;color:#756e86;z-index:3;pointer-events:none}
  @media (max-width:820px){.top{top:20px;left:22px;right:22px}.title{font-size:36px;margin-top:10px}.desc{max-width:210px}.live{padding:8px 10px;letter-spacing:.08em}.panel{width:calc(100% - 24px);max-width:480px;top:auto;right:12px;left:12px;margin:auto;bottom:10px;transform:none;padding:14px 18px 16px;border-radius:16px;max-height:43vh}.panel-top{margin-bottom:9px}.group{margin-top:12px;padding-top:11px}.group .gtitle{margin-bottom:10px}.control{margin:10px 0}.actions{margin-top:10px}.bottom{bottom:calc(min(43vh,360px) + 30px);left:22px}.hint,.sep,.credit{display:none}.desc{font-size:11px}.swatch{height:24px;width:24px}} 
  @media (max-height:650px) and (min-width:821px){.panel{top:52%;max-height:94vh}.top{top:19px}.bottom{bottom:16px}}
</style>
</head>
<body>
<canvas id="scene" aria-label="실시간으로 움직이는 3D 파티클 조형 아트"></canvas>
<div class="grain"></div>
<header class="top"><div><div class="kicker">GENERATIVE ART / 001</div><h1 class="title">BLOOM<br>SCULPTURE<span style="color:#9e8cda">.</span></h1><p class="desc">흩어진 빛이 하나의 형체가 되는 순간.<br>입자들이 모이고, 피어나고, 다시 흩어집니다.</p></div><div class="live"><span class="dot"></span> LIVE GENERATION</div></header>
<aside class="panel" aria-label="아트 조절 패널">
 <div class="panel-top"><span class="panel-name">ART CONTROLS</span><span class="micro">SCULPTURE / 01</span></div>
 <div class="group" style="margin-top:0;border-top:0;padding-top:0"><div class="gtitle">형태 <span>01 — SHAPE</span></div><div class="modes"><button data-mode="bloom" class="active">Bloom</button><button data-mode="orb">Orb</button><button data-mode="creature">Creature</button></div></div>
 <div class="group"><div class="gtitle">빛의 색상 <span>02 — COLOR</span></div><div class="swatches"><button class="swatch active" data-color="pearl" aria-label="화이트 펄" title="화이트 펄"></button><button class="swatch" data-color="aurora" aria-label="민트 오로라" title="민트 오로라"></button><button class="swatch" data-color="rose" aria-label="로즈 핑크" title="로즈 핑크"></button></div></div>
 <div class="group"><div class="gtitle">움직임 <span>03 — MOTION</span></div>
  <div class="control"><div class="c-row"><label for="speed">회전 속도</label><span class="value" id="speedVal">0.7×</span></div><input id="speed" type="range" min="0" max="2" step="0.1" value="0.7"></div>
  <div class="control"><div class="c-row"><label for="density">입자 밀도</label><span class="value" id="densityVal">75%</span></div><input id="density" type="range" min="20" max="100" step="5" value="75"></div>
  <div class="control"><div class="c-row"><label for="scatter">흩어짐</label><span class="value" id="scatterVal">35%</span></div><input id="scatter" type="range" min="0" max="100" step="5" value="10"></div>
  <div class="control"><div class="c-row"><label for="glow">글로우</label><span class="value" id="glowVal">75%</span></div><input id="glow" type="range" min="0" max="100" step="5" value="75"></div>
 </div>
 <div class="actions"><button id="pauseBtn" class="primary">Ⅱ 일시정지</button><button id="regenBtn">↻ 새로 피우기</button><button id="saveBtn">↓ 이미지 저장</button><button id="fullBtn">⛶ 전체화면</button></div>
</aside>
<footer class="bottom"><span class="status"><i></i><span id="phase">FORMING</span></span><div class="sep"></div><span class="hint">마우스 드래그로 시점을 움직일 수 있어요 · SPACE 일시정지</span></footer><div class="credit">MADE WITH LIGHT & CODE</div>
<script>
(() => {
'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false});
if(!ctx){document.getElementById('phase').textContent='CANVAS NOT SUPPORTED';return;}
const state={mode:'bloom',color:'pearl',speed:.7,density:.75,scatter:.10,glow:.75,playing:true,yaw:0,pitch:0,clock:0,seed:2};
const palettes={pearl:[[236,242,255],[194,171,255],[255,225,252]],aurora:[[191,255,246],[90,239,226],[157,146,255]],rose:[[255,238,232],[255,159,197],[189,159,255]]};
const NU=78,NV=43,N=NU*NV,TAU=Math.PI*2;
let W=0,H=0,DPR=1,cx=0,cy=0,scale=1,last=0,points=[],stars=[],cacheSprites={},pulse=0;
const hash=(a,b,c=0)=>{let x=Math.sin(a*127.1+b*311.7+c*79.7)*43758.5453123;return x-Math.floor(x)};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t)};
const rnd3=(u,v,s)=>[hash(u,v,s)*2-1,hash(u+17,v+4,s)*2-1,hash(u+77,v+13,s)*2-1];
function setupPoints(){points=[];for(let row=0;row<NV;row++){for(let col=0;col<NU;col++){const u=(col+.5)/NU,v=(row+.5)/NV,rand=rnd3(col,row,state.seed);points.push({u,v,rand,weight:hash(col+1,row+3,5),tw:hash(col+3,row+11,8),x:0,y:0,z:0,sx:0,sy:0,depth:0,on:false});}}}
function setupStars(){stars=[];for(let i=0;i<160;i++)stars.push({x:hash(i,7),y:hash(i+22,9),r:.3+hash(i+9,4)*.95,a:.11+hash(i+1,12)*.23,t:hash(i,91)*TAU});}
function resize(){const bounds=canvas.getBoundingClientRect();W=bounds.width;H=bounds.height;DPR=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);cx=W*(W>820?.505:.5);cy=H*(W>820?.55:.43);scale=Math.min(W*(W>820?.28:.54),H*.30);ctx.fillStyle='#05050a';ctx.fillRect(0,0,W,H);setupStars()}
function spriteFor(key,glow){const cacheKey=key+'-'+Math.round(glow*10);if(cacheSprites[cacheKey])return cacheSprites[cacheKey];const RGB=palettes[key],size=100,s=document.createElement('canvas');s.width=size;s.height=size;const x=s.getContext('2d');const g=x.createRadialGradient(50,50,0,50,50,49);const [r,gc,b]=RGB[1];g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.065,`rgba(${RGB[0][0]},${RGB[0][1]},${RGB[0][2]},.94)`);g.addColorStop(.20,`rgba(${r},${gc},${b},${.32+.25*glow})`);g.addColorStop(.5,`rgba(${r},${gc},${b},${.06+.055*glow})`);g.addColorStop(1,`rgba(${r},${gc},${b},0)`);x.fillStyle=g;x.fillRect(0,0,100,100);return cacheSprites[cacheKey]=s}
function form(p,t){const theta=p.v*Math.PI,phi=p.u*TAU,sv=Math.sin(theta),cv=Math.cos(theta),cp=Math.cos(phi),sp=Math.sin(phi);
  let x,y,z;
  if(state.mode==='bloom'){
    const petals=Math.pow(Math.max(0,Math.cos(7*phi+0.35*Math.sin(theta*2+t*.4))),2.0);
    const unfold=(.63+.37*Math.sin(t*.6-1.4));
    const r=.7+(.48*petals+.21*Math.cos(4*theta+6*phi+t*.3))*Math.pow(sv,.8)+.15*Math.sin(5*theta-t*.38);
    x=r*sv*cp*1.30;z=r*sv*sp*1.05;
    y=cv*(.80+.25*petals)+(.26+unfold*.26)*sv*sv*Math.sin(6*phi+.32*theta)+.12*Math.cos(3*theta-t*.4);
  }else if(state.mode==='orb'){
    const r=1+.16*Math.sin(8*phi+2*theta+t*.4)*Math.pow(sv,2)+.11*Math.cos(7*theta-t*.7);
    x=r*sv*cp;y=r*cv;z=r*sv*sp;
  }else{
    const tendril=Math.pow(Math.abs(Math.sin(6*phi+Math.sin(t*.35))),9);
    const r=.74+.48*tendril*Math.pow(sv,.7)+.1*Math.sin(theta*9+phi*3-t);
    x=r*sv*cp*(.90+.13*Math.sin(t*.7));
    y=r*cv*1.46-.16*Math.sin(phi*6+t*.4)*sv;
    z=r*sv*sp*(.72+.2*tendril);
  }
  const ripple=.055*Math.sin(11*phi+theta*9+t*.85+p.tw*4)+.045*Math.cos(7*theta-phi*4-t*.55);
  return [x+ripple*sv*cp,y+ripple*cv,z+ripple*sv*sp];
}
function render(dt){if(state.playing)state.clock+=dt;const t=state.clock;const gl=state.glow;
 // Dissolve and re-form in a long repeating cycle. A manual scatter dial can add extra dispersion.
 const breathe=.5+.5*Math.cos(t*.56-.2),assembled=smooth(.12,.8,breathe),dispersion=(1-assembled)*(.48+state.scatter*.88)+state.scatter*.50;
 const follow=state.playing?clamp(dt*4.7,0,1):1;
 ctx.globalCompositeOperation='source-over';ctx.fillStyle=state.playing?'rgba(5,5,10,.28)':'#05050a';ctx.fillRect(0,0,W,H);
 const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.49);bg.addColorStop(0,state.color==='aurora'?'rgba(25,54,63,.075)':state.color==='rose'?'rgba(62,24,50,.083)':'rgba(50,32,83,.08)');bg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 for(const s of stars){ctx.globalAlpha=s.a*(.7+.3*Math.sin(t*.4+s.t));ctx.fillStyle='#d9d7f5';ctx.fillRect(s.x*W,s.y*H,s.r,s.r)}ctx.globalAlpha=1;
 const yaw=t*state.speed*.16+state.yaw,pitch=-.24+state.pitch+.08*Math.sin(t*.19),cyaw=Math.cos(yaw),syaw=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
 const centerScale=scale*(1-.10*Math.max(0,dispersion-1));
 for(let i=0;i<N;i++){
   const p=points[i],[a,b,c]=form(p,t),scat=p.rand;
   const drift=t*.35+p.tw*TAU;let x=a+dispersion*(scat[0]*1.7+.12*Math.sin(drift)),y=b+dispersion*(scat[1]*1.6+.15*Math.cos(drift*.8)),z=c+dispersion*(scat[2]*1.5+.12*Math.sin(drift*.6));
   x+=.025*Math.sin(t*.9+p.v*17+p.u*19);z+=.025*Math.cos(t*.85+p.v*13-p.u*27);
   const X=cyaw*x+syaw*z,Z=-syaw*x+cyaw*z,Y=cp*y-sp*Z,depth=sp*y+cp*Z;
   const perspective=3.5/(3.5+depth*.15);p.sx=cx+X*centerScale*perspective;p.sy=cy-Y*centerScale*perspective;p.depth=depth;
   p.on=p.weight<(state.density*.85+.15);p.size=clamp((1.3-depth*.10)*(.6+p.tw*.5),.35,2.6);
 }
 // Constellation wiring: neighboring samples from the sculpted 3D surface.
 ctx.save();ctx.globalCompositeOperation='lighter';const col=palettes[state.color][1],wireRGB=`${col[0]},${col[1]},${col[2]}`;
 ctx.lineWidth=.48;const skip=state.density>.65?2:3;ctx.beginPath();let edges=0;
 for(let row=1;row<NV-1;row+=skip){for(let column=0;column<NU;column+=skip){const idx=row*NU+column,p=points[idx],right=points[row*NU+((column+skip)%NU)],down=points[Math.min(NV-1,row+skip)*NU+column];if(!p.on)continue;
   if(right.on&&Math.hypot(p.sx-right.sx,p.sy-right.sy)<76){ctx.moveTo(p.sx,p.sy);ctx.lineTo(right.sx,right.sy);edges++}
   if(down.on&&Math.hypot(p.sx-down.sx,p.sy-down.sy)<76){ctx.moveTo(p.sx,p.sy);ctx.lineTo(down.sx,down.sy);edges++}
 }}
 ctx.strokeStyle=`rgba(${wireRGB},${.13+.24*assembled})`;ctx.stroke();
 // Add faint rays connecting a subset of brighter constellation points.
 ctx.beginPath();for(let i=9;i<N-NU-12;i+=59){let a=points[i],b=points[i+NU+3];if(a.on&&b.on&&Math.hypot(a.sx-b.sx,a.sy-b.sy)<75){ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy)}}ctx.strokeStyle=`rgba(${wireRGB},.09)`;ctx.stroke();
 const sprite=spriteFor(state.color,gl);const [r,g,b]=palettes[state.color][0];ctx.fillStyle=`rgb(${r},${g},${b})`;
 for(let i=0;i<N;i++){const p=points[i];if(!p.on)continue;if(p.sx<0||p.sx>W||p.sy<0||p.sy>H)continue;const brightness=.50+.50*p.tw,twinkle=.78+.22*Math.sin(t*1.45+i*.7);
   ctx.globalAlpha=(.45+.52*assembled)*brightness*twinkle;
   const sz=(7+p.size*7)*(0.65+gl*.85);ctx.drawImage(sprite,p.sx-sz/2,p.sy-sz/2,sz,sz);
   if(p.tw>.72){ctx.globalAlpha=.5+.35*twinkle;const pr=p.size*.60;ctx.fillRect(p.sx-pr/2,p.sy-pr/2,pr,pr)}
   if(p.tw>.991&&assembled>.3){const R=4+p.tw*7;ctx.globalAlpha=.20+.20*twinkle;ctx.beginPath();ctx.moveTo(p.sx-R,p.sy);ctx.lineTo(p.sx+R,p.sy);ctx.moveTo(p.sx,p.sy-R);ctx.lineTo(p.sx,p.sy+R);ctx.strokeStyle='#f9f5ff';ctx.lineWidth=.6;ctx.stroke()}
 }
 ctx.restore();ctx.globalAlpha=1;
 const currentPhase=assembled>.78?'SCULPTING':assembled<.25?'DISSOLVING':'FORMING';document.getElementById('phase').textContent=currentPhase;
}
function frame(now){let dt=last?Math.min((now-last)/1000,.05):.016;last=now;if(state.playing)render(dt);requestAnimationFrame(frame)}
function setSlider(id,key,format){const input=document.getElementById(id),out=document.getElementById(id+'Val');function update(){const val=Number(input.value);state[key]=id==='speed'?val:val/100;out.textContent=format(val);input.style.setProperty('--v', ((val-Number(input.min))/(Number(input.max)-Number(input.min))*100)+'%')}input.addEventListener('input',update);update()}
setSlider('speed','speed',v=>v.toFixed(1)+'×');setSlider('density','density',v=>v+'%');setSlider('scatter','scatter',v=>v+'%');setSlider('glow','glow',v=>v+'%');
for(const btn of document.querySelectorAll('[data-mode]'))btn.addEventListener('click',()=>{state.mode=btn.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b===btn));state.clock=0});
for(const btn of document.querySelectorAll('[data-color]'))btn.addEventListener('click',()=>{state.color=btn.dataset.color;document.querySelectorAll('[data-color]').forEach(b=>b.classList.toggle('active',b===btn));cacheSprites={}});
const pauseBtn=document.getElementById('pauseBtn');function togglePause(){state.playing=!state.playing;pauseBtn.textContent=state.playing?'Ⅱ 일시정지':'▶ 재생'}pauseBtn.addEventListener('click',togglePause);
document.getElementById('regenBtn').addEventListener('click',()=>{state.clock=0;state.seed++;setupPoints();ctx.fillStyle='#05050a';ctx.fillRect(0,0,W,H);render(0)});
document.getElementById('saveBtn').addEventListener('click',()=>{const link=document.createElement('a');link.download='Bloom-Sculpture.png';link.href=canvas.toDataURL('image/png');link.click()});
document.getElementById('fullBtn').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()});
let grabbing=false,mx=0,my=0;canvas.addEventListener('pointerdown',e=>{grabbing=true;mx=e.clientX;my=e.clientY;canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging')});canvas.addEventListener('pointermove',e=>{if(!grabbing)return;state.yaw+=(e.clientX-mx)*.007;state.pitch=clamp(state.pitch+(e.clientY-my)*.005,-1.1,1.1);mx=e.clientX;my=e.clientY});function release(){grabbing=false;canvas.classList.remove('dragging')}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
document.addEventListener('keydown',e=>{if(e.target instanceof HTMLInputElement)return;if(e.code==='Space'){e.preventDefault();togglePause()}if(e.key==='r'||e.key==='R')document.getElementById('regenBtn').click();if(e.key==='s'||e.key==='S')document.getElementById('saveBtn').click()});
window.addEventListener('resize',resize);setupPoints();resize();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
